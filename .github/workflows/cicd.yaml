name: Build and push image
run-name: Build and push image

on:
  push:
    branches:
      - "main"

env:
  IMAGE_NAME: yellwinhtut/nginx-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Short SHA
        id: vars
        run: echo ::set-output name=short_sha::${GITHUB_SHA::8}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.get_sha.outputs.SHA_SHORT }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.30.8/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update Deployment YAML
        run: |
          yq e -i '.spec.template.spec.containers[0].image = env(IMAGE_NAME) + ":" + env(SHORT_SHA)' nginx-demo/02-deployment.yaml
        working-directory: ./nginx-demo/02-deployment.yaml


      